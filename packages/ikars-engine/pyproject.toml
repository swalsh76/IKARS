[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ikars-engine"
version = "0.0.0"
description = "The IKARS engine: feeds, plugins, signals, recommendations and the ledger"
license = "MIT"
license-files = ["../../LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "ikars-core",
    "msgspec>=0.22",
    "pyarrow>=26",
    "tomli-w>=1.2",
    "tzdata>=2025.2",
]

[tool.uv.sources]
ikars-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ikars_engine"]
