[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ikars-engine"
version = "0.0.0"
description = "The IKARS engine: feeds, plugins, signals, recommendations and the ledger"
license = "MIT"
license-files = ["../../LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "ikars-core",
    "msgspec>=0.22",
    "pyarrow>=26",
    "starlette>=0.48",
    "tomli-w>=1.2",
    "tzdata>=2025.2",
    "uvicorn>=0.37",
    "velopack>=1.2.161",
]

[project.scripts]
ikars = "ikars_engine.__main__:entry"

# the signals IKARS ships, found by the engine like any other plugin (M1.12b)
[project.entry-points."ikars.plugins"]
momentum = "ikars_engine.signals.momentum:Momentum"

[tool.uv.sources]
ikars-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ikars_engine"]
